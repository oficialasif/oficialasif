<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
    <linearGradient id="cardG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2128"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <style>
      @keyframes fadeIn { from{opacity:0;}to{opacity:1;} }
      @keyframes bob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);} }
      .card { animation: fadeIn 0.8s ease both; }
      .icon { animation: bob 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="200" fill="url(#bgG)"/>
  <pattern id="dp" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.7" fill="#58a6ff" opacity="0.05"/>
  </pattern>
  <rect width="900" height="200" fill="url(#dp)"/>

  <!-- Card 1: Football -->
  <g class="card">
    <rect x="25" y="16" width="270" height="168" rx="10" fill="url(#cardG1)" stroke="#58a6ff" stroke-width="1" opacity="0.9"/>
    <rect x="25" y="16" width="270" height="3" rx="1.5" fill="#58a6ff"/>
    <text x="160" y="72" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif" font-size="36" class="icon" style="animation-delay:0s;">⚽</text>
    <text x="160" y="104" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Football</text>
    <text x="160" y="128" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">Weekend matches &amp;</text>
    <text x="160" y="146" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">team sport enthusiast</text>
    <text x="160" y="170" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#58a6ff">⚡ Active &amp; Team Player</text>
  </g>

  <!-- Card 2: Bike Tour -->
  <g class="card">
    <rect x="315" y="16" width="270" height="168" rx="10" fill="url(#cardG1)" stroke="#a371f7" stroke-width="1" opacity="0.9"/>
    <rect x="315" y="16" width="270" height="3" rx="1.5" fill="#a371f7"/>
    <text x="450" y="72" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif" font-size="36" class="icon" style="animation-delay:.5s;">🏍️</text>
    <text x="450" y="104" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Bike Tour</text>
    <text x="450" y="128" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">Exploring highways &amp;</text>
    <text x="450" y="146" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">riding through open roads</text>
    <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#a371f7">🛣️ Adventure &amp; Focus</text>
  </g>

  <!-- Card 3: Travelling -->
  <g class="card">
    <rect x="605" y="16" width="270" height="168" rx="10" fill="url(#cardG1)" stroke="#f78166" stroke-width="1" opacity="0.9"/>
    <rect x="605" y="16" width="270" height="3" rx="1.5" fill="#f78166"/>
    <text x="740" y="72" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif" font-size="36" class="icon" style="animation-delay:1s;">✈️</text>
    <text x="740" y="104" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Travelling</text>
    <text x="740" y="128" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">Discovering new places,</text>
    <text x="740" y="146" text-anchor="middle" font-family="'Segoe UI',Inter,sans-serif" font-size="12" fill="#8b949e">cultures &amp; perspectives</text>
    <text x="740" y="170" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="600" fill="#f78166">🌍 Wanderer &amp; Curious</text>
  </g>
</svg>
