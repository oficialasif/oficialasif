<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0f1923"/>
    </linearGradient>
    <linearGradient id="barReact" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#a371f7"/>
    </linearGradient>
    <linearGradient id="barFlutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#54aeff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="barNode" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3fb950"/>
      <stop offset="100%" style="stop-color:#f78166"/>
    </linearGradient>
    <linearGradient id="barDb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#f78166"/>
    </linearGradient>
    <style>
      @keyframes fadeIn { from{opacity:0;}to{opacity:1;} }
      .fade { animation: fadeIn 0.8s ease both; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)"/>
  <pattern id="d2" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.7" fill="#58a6ff" opacity="0.05"/>
  </pattern>
  <rect width="900" height="260" fill="url(#d2)"/>

  <!-- Left Column: Core Tech Categories -->
  <!-- Header: Languages -->
  <text x="32" y="38" font-family="'Segoe UI',Inter,sans-serif" font-size="11" fill="#8b949e" font-weight="700" letter-spacing="1">LANGUAGES</text>
  
  <!-- HTML5 -->
  <rect x="32" y="48" width="105" height="34" rx="7" fill="#1c2128" stroke="#e34c26" stroke-width="0.9" opacity="0.9"/>
  <text x="50" y="70" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🌐</text>
  <text x="70" y="70" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e6edf3" font-weight="600">HTML5</text>

  <!-- CSS3 -->
  <rect x="145" y="48" width="100" height="34" rx="7" fill="#1c2128" stroke="#264de4" stroke-width="0.9" opacity="0.9"/>
  <text x="162" y="70" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🎨</text>
  <text x="182" y="70" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e6edf3" font-weight="600">CSS3</text>

  <!-- JavaScript -->
  <rect x="253" y="48" width="118" height="34" rx="7" fill="#1c2128" stroke="#f7df1e" stroke-width="0.9" opacity="0.9"/>
  <text x="270" y="70" font-family="'Segoe UI Emoji',sans-serif" font-size="14">⚡</text>
  <text x="290" y="70" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f7df1e" font-weight="600">JavaScript</text>

  <!-- Dart -->
  <rect x="379" y="48" width="92" height="34" rx="7" fill="#1c2128" stroke="#0175C2" stroke-width="0.9" opacity="0.9"/>
  <text x="395" y="70" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🎯</text>
  <text x="415" y="70" font-family="'Segoe UI',sans-serif" font-size="12" fill="#5ab2e8" font-weight="600">Dart</text>

  <!-- Header: Frameworks & Apps -->
  <text x="32" y="112" font-family="'Segoe UI',Inter,sans-serif" font-size="11" fill="#8b949e" font-weight="700" letter-spacing="1">FRAMEWORKS &amp; MOBILE</text>

  <!-- React -->
  <rect x="32" y="122" width="105" height="34" rx="7" fill="#1c2128" stroke="#61DBFB" stroke-width="0.9" opacity="0.9"/>
  <text x="50" y="144" font-family="'Segoe UI Emoji',sans-serif" font-size="14">⚛️</text>
  <text x="70" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="#61DBFB" font-weight="600">React</text>

  <!-- Next.js -->
  <rect x="145" y="122" width="100" height="34" rx="7" fill="#1c2128" stroke="#a371f7" stroke-width="0.9" opacity="0.9"/>
  <text x="162" y="144" font-family="'Segoe UI Emoji',sans-serif" font-size="14">▲</text>
  <text x="182" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e6edf3" font-weight="600">Next.js</text>

  <!-- Flutter -->
  <rect x="253" y="122" width="105" height="34" rx="7" fill="#1c2128" stroke="#54aeff" stroke-width="0.9" opacity="0.9"/>
  <text x="270" y="144" font-family="'Segoe UI Emoji',sans-serif" font-size="14">📱</text>
  <text x="290" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="#54aeff" font-weight="600">Flutter</text>

  <!-- Node.js -->
  <rect x="366" y="122" width="105" height="34" rx="7" fill="#1c2128" stroke="#3fb950" stroke-width="0.9" opacity="0.9"/>
  <text x="382" y="144" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🟢</text>
  <text x="402" y="144" font-family="'Segoe UI',sans-serif" font-size="12" fill="#3fb950" font-weight="600">Node.js</text>

  <!-- Header: Database & Backend -->
  <text x="32" y="186" font-family="'Segoe UI',Inter,sans-serif" font-size="11" fill="#8b949e" font-weight="700" letter-spacing="1">DATABASES &amp; BACKEND</text>

  <!-- MongoDB -->
  <rect x="32" y="196" width="115" height="34" rx="7" fill="#1c2128" stroke="#4DB33D" stroke-width="0.9" opacity="0.9"/>
  <text x="48" y="218" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🍃</text>
  <text x="68" y="218" font-family="'Segoe UI',sans-serif" font-size="12" fill="#4DB33D" font-weight="600">MongoDB</text>

  <!-- SQL -->
  <rect x="155" y="196" width="95" height="34" rx="7" fill="#1c2128" stroke="#00758F" stroke-width="0.9" opacity="0.9"/>
  <text x="170" y="218" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🗄️</text>
  <text x="190" y="218" font-family="'Segoe UI',sans-serif" font-size="12" fill="#58a6ff" font-weight="600">MySQL</text>

  <!-- Firebase -->
  <rect x="258" y="196" width="105" height="34" rx="7" fill="#1c2128" stroke="#f78166" stroke-width="0.9" opacity="0.9"/>
  <text x="274" y="218" font-family="'Segoe UI Emoji',sans-serif" font-size="14">🔥</text>
  <text x="294" y="218" font-family="'Segoe UI',sans-serif" font-size="12" fill="#f78166" font-weight="600">Firebase</text>

  <!-- Right Column: Focus Areas & Proficiency Bars -->
  <!-- Vertical separator line -->
  <line x1="510" y1="35" x2="510" y2="235" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="540" y="38" font-family="'Segoe UI',Inter,sans-serif" font-size="11" fill="#8b949e" font-weight="700" letter-spacing="1">EXPERTISE FOCUS</text>

  <!-- Bar 1: React & Next.js -->
  <text x="540" y="65" font-family="'Segoe UI',sans-serif" font-size="12" fill="#58a6ff" font-weight="600">React &amp; Next.js Ecosystem</text>
  <text x="860" y="65" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e">90%</text>
  <rect x="540" y="73" width="320" height="7" rx="3.5" fill="#21262d"/>
  <rect x="540" y="73" width="288" height="7" rx="3.5" fill="url(#barReact)"/>

  <!-- Bar 2: Flutter Mobile Apps -->
  <text x="540" y="112" font-family="'Segoe UI',sans-serif" font-size="12" fill="#54aeff" font-weight="600">Flutter Mobile Development</text>
  <text x="860" y="112" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e">82%</text>
  <rect x="540" y="120" width="320" height="7" rx="3.5" fill="#21262d"/>
  <rect x="540" y="120" width="262" height="7" rx="3.5" fill="url(#barFlutter)"/>

  <!-- Bar 3: Node.js & Full Stack -->
  <text x="540" y="159" font-family="'Segoe UI',sans-serif" font-size="12" fill="#3fb950" font-weight="600">Node.js &amp; API Architecture</text>
  <text x="860" y="159" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e">85%</text>
  <rect x="540" y="167" width="320" height="7" rx="3.5" fill="#21262d"/>
  <rect x="540" y="167" width="272" height="7" rx="3.5" fill="url(#barNode)"/>

  <!-- Bar 4: Databases (MongoDB / SQL) -->
  <text x="540" y="206" font-family="'Segoe UI',sans-serif" font-size="12" fill="#a371f7" font-weight="600">MongoDB &amp; SQL Databases</text>
  <text x="860" y="206" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8b949e">80%</text>
  <rect x="540" y="214" width="320" height="7" rx="3.5" fill="#21262d"/>
  <rect x="540" y="214" width="256" height="7" rx="3.5" fill="url(#barDb)"/>
</svg>
